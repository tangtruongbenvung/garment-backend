name: DD04 A00 preview checks
on:
  push:
    branches: ['feature/dd04-agent-dashboard-3d']
  pull_request:
    paths:
      - 'dd04-agent-control/**'
      - 'netlify/functions/dd04-a00.mjs'
      - 'tests/**'
      - 'package.json'
jobs:
  test-a00:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dd04-agent-control/runtime-core.mjs
      - run: node --check dd04-agent-control/a03-channel-script-planner.mjs
      - run: node --check dd04-agent-control/channel-context-core.mjs
      - run: node --check dd04-agent-control/channel-registry-v2.mjs
      - run: node --check dd04-agent-control/channel-control.js
      - run: node --check dd04-agent-control/a03-preview.js
      - run: node --check netlify/functions/dd04-a00.mjs
      - run: node --check dd04-agent-control/live-dashboard.js
      - run: node --check dd04-agent-control/persistence-contract.mjs
      - run: node --check dd04-agent-control/supabase-pg-repository.mjs
      - run: node --check dd04-agent-control/pg-tls.mjs
      - run: node --check dd04-agent-control/ceo-approval-contract.mjs
      - run: node --check dd04-agent-control/ceo-readiness-core.mjs
      - run: node --check dd04-agent-control/ceo-gates-preflight.mjs
      - run: node --check netlify/functions/dd04-ceo-readiness.mjs
      - run: node --check dd04-agent-control/ceo-login.js
      - run: node --test tests/dd04-a00.test.mjs tests/dd04-persistence-contract.test.mjs tests/dd04-schema-v2.test.mjs tests/dd04-postgres-adapter.test.mjs tests/dd04-pg-tls.test.mjs tests/dd04-ceo-approval-contract.test.mjs tests/dd04-ceo-readiness.test.mjs tests/dd04-ceo-clipboard-script.test.mjs tests/dd04-ceo-gates-preflight.test.mjs tests/dd04-ceo-login.test.mjs tests/dd04-ceo-admin-bootstrap.test.mjs tests/dd04-a03-channel-scripts.test.mjs tests/dd04-a03-preview-api.test.mjs tests/dd04-channel-context.test.mjs tests/dd04-channel-control-ui.test.mjs tests/dd04-channel-registry-v2.test.mjs tests/dd04-channel-registry-v2-schema.test.mjs

  validate-windows-powershell:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Parse CEO bootstrap with Windows PowerShell 5.1 (no execution)
        shell: powershell
        run: |
          $path = Join-Path $PWD 'dd04-agent-control/scripts/dd04-set-ceo-password-once-ASCII.ps1'
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            foreach ($parseError in $parseErrors) { Write-Error ($parseError.Message + ' line ' + $parseError.Extent.StartLineNumber) }
            exit 1
          }
          Write-Host 'PASS - Windows PowerShell 5.1 parsed script, zero syntax errors; script NOT executed.'
