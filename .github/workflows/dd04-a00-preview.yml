name: DD04 A00 preview checks
on:
  push:
    branches: ['feature/dd04-agent-dashboard-3d']
  pull_request:
    paths:
      - 'dd04-agent-control/**'
      - 'netlify/functions/dd04-a00.mjs'
      - 'tests/**'
      - 'package.json'
jobs:
  test-a00:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dd04-agent-control/a00-delegated-orchestrator.mjs
      - run: node --check dd04-agent-control/a00-delegated-gates.mjs
      - run: node --check dd04-agent-control/a00-018-existing-ledger-read-repository.mjs
      - run: node --check dd04-agent-control/a00-019-readiness-audit.mjs
      - run: node --check dd04-agent-control/a00-020-atomic-ledger-repository.mjs
      - run: node --check dd04-agent-control/a00-020-save-task-plan.mjs
      - run: node --check dd04-agent-control/a00-020-db-actor-resolver.mjs
      - run: node --check dd04-agent-control/a00-022-delegated-transaction-preflight.mjs
      - run: node --check dd04-agent-control/a00-021-backend-runtime.mjs
      - run: node --check netlify/functions/dd04-a00-021-backend-probe.mjs
      - run: node --check dd04-agent-control/a00-020-attach-artifact.mjs
      - run: node --check netlify/functions/dd04-a00-020-worklist.mjs
      - run: node --check dd04-agent-control/runtime-core.mjs
      - run: node --check dd04-agent-control/a03-channel-script-planner.mjs
      - run: node --check dd04-agent-control/channel-context-core.mjs
      - run: node --check dd04-agent-control/channel-registry-v2.mjs
      - run: node --check dd04-agent-control/channel-control.js
      - run: node --check dd04-agent-control/a03-preview.js
      - run: node --check netlify/functions/dd04-a00.mjs
      - run: node --check dd04-agent-control/live-dashboard.js
      - run: node --check dd04-agent-control/persistence-contract.mjs
      - run: node --check dd04-agent-control/supabase-pg-repository.mjs
      - run: node --check dd04-agent-control/pg-tls.mjs
      - run: node --check dd04-agent-control/ceo-approval-contract.mjs
      - run: node --check dd04-agent-control/ceo-readiness-core.mjs
      - run: node --check dd04-agent-control/ceo-gates-preflight.mjs
      - run: node --check dd04-agent-control/ceo-gate-review-core.mjs
      - run: node --check netlify/functions/dd04-ceo-gate-review.mjs
      - run: node --check netlify/functions/dd04-ceo-gate-list.mjs
      - run: node --check netlify/functions/dd04-ceo-readiness.mjs
      - run: node --check dd04-agent-control/ceo-login.js
      - run: node --test tests/dd04-a00-delegated-orchestrator.test.mjs tests/dd04-a00-delegated-gates.test.mjs tests/dd04-a00-018-read-ledger.test.mjs tests/dd04-a00-019-readiness-audit.test.mjs tests/dd04-a00-020-atomic-ledger.test.mjs tests/dd04-a00-020-save-plan.test.mjs tests/dd04-a00-020-db-actor.test.mjs tests/dd04-a00-020-final-sql-contract.test.mjs tests/dd04-a00-020-attach-artifact.test.mjs tests/dd04-a00-021-backend-runtime.test.mjs tests/dd04-a00-021-probe-contract.test.mjs tests/dd04-a00-022-delegation.test.mjs tests/dd04-a00-022-sql-contract.test.mjs
      - run: node --test tests/dd04-a00.test.mjs tests/dd04-persistence-contract.test.mjs tests/dd04-schema-v2.test.mjs tests/dd04-postgres-adapter.test.mjs tests/dd04-pg-tls.test.mjs tests/dd04-ceo-approval-contract.test.mjs tests/dd04-ceo-readiness.test.mjs tests/dd04-ceo-clipboard-script.test.mjs tests/dd04-ceo-gates-preflight.test.mjs tests/dd04-ceo-gate-review.test.mjs tests/dd04-ceo-gate-list.test.mjs tests/dd04-ceo-login.test.mjs tests/dd04-ceo-admin-bootstrap.test.mjs tests/dd04-a03-channel-scripts.test.mjs tests/dd04-a03-preview-api.test.mjs tests/dd04-channel-context.test.mjs tests/dd04-channel-control-ui.test.mjs tests/dd04-channel-registry-v2.test.mjs tests/dd04-channel-registry-v2-schema.test.mjs

  validate-windows-powershell:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Parse CEO bootstrap with Windows PowerShell 5.1 (no execution)
        shell: powershell
        run: |
          $path = Join-Path $PWD 'dd04-agent-control/scripts/dd04-set-ceo-password-once-ASCII.ps1'
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            foreach ($parseError in $parseErrors) { Write-Error ($parseError.Message + ' line ' + $parseError.Extent.StartLineNumber) }
            exit 1
          }
          Write-Host 'PASS - Windows PowerShell 5.1 parsed script, zero syntax errors; script NOT executed.'

  validate-sql-ephemeral:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: postgres_ci_only
    steps:
      - uses: actions/checkout@v4
      - name: Install ephemeral PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Prepare isolated baseline (NOT Supabase staging)
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/dd04-a00-020-ephemeral-pg17-fixture.sql
      - name: Parse and apply final SQL to isolated PostgreSQL 17 CI database ONLY
        run: psql -v ON_ERROR_STOP=1 -f dd04-agent-control/supabase/24_A00_020_FINAL_CANDIDATE_STAGING_ONLY_DO_NOT_RUN.sql
      - name: Test runtime RLS denial, triggers and locked G1
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/dd04-a00-020-ephemeral-pg17-verify.sql
      - name: Parse and test A00-022 integrated final candidate on EPHEMERAL PostgreSQL only
        run: psql -v ON_ERROR_STOP=1 -f dd04-agent-control/supabase/27_A00_022_INTEGRATED_G1_A11_STAGING_REVIEW_ONLY_DO_NOT_RUN.sql
      - name: Verify A00-022 integrated schema and legacy lock unchanged
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/dd04-a00-022-integration-postcheck.sql
      - name: Exercise isolated A00 worker insert and denied handoff with rollback
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/dd04-a00-021-ephemeral-agent-write-and-handoff.sql
      - name: Provision disposable CEO and worker fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/dd04-a00-022-ephemeral-g1-a11-setup.sql
      - name: Test atomic internal G1 and A11 spending guard as dedicated backend login
        run: PGUSER=dd04_a00_backend PGPASSWORD=ci_ephemeral_only_not_production psql -v ON_ERROR_STOP=1 -f tests/sql/dd04-a00-022-ephemeral-g1-a11-transaction.sql
      - name: Audit transaction ROLLBACK as isolated database owner
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/dd04-a00-022-ephemeral-rollback-verify.sql
