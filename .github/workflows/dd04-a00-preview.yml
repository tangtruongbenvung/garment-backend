name: DD04 A00 preview checks
on:
  push:
    branches: ['feature/dd04-agent-dashboard-3d']
  pull_request:
    paths:
      - 'dd04-agent-control/**'
      - 'netlify/functions/dd04-a00.mjs'
      - 'tests/dd04-a00.test.mjs'
      - 'package.json'
jobs:
  test-a00:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dd04-agent-control/runtime-core.mjs
      - run: node --check netlify/functions/dd04-a00.mjs
      - run: node --check dd04-agent-control/live-dashboard.js
      - run: node --test tests/dd04-a00.test.mjs
