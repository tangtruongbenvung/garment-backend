<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garment Cloud ERP - Quản Lý May Mặc Online</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary fw-bold">Garment ERP Cloud (Đồng bộ số liệu)</h2>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addModal">+ Thêm Đơn Hàng Mới</button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table id="ordersTable" class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Mã PO</th>
                            <th>Khách Hàng</th>
                            <th>Mã Style</th>
                            <th>Size S</th>
                            <th>Size M</th>
                            <th>Size L</th>
                            <th>Size XL</th>
                            <th>Size XXL</th>
                            <th>Tổng SL</th>
                            <th>Đơn Giá CM</th>
                            <th>Doanh Thu</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Thêm Đơn Hàng -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nhập Đơn Hàng Mới Tới Cloud</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="orderForm" class="row g-3">
                        <div class="col-md-4"><label class="form-label">Mã PO</label><input type="text" id="po_code" class="form-control" required></div>
                        <div class="col-md-4"><label class="form-label">Khách Hàng</label><input type="text" id="customer" class="form-control" required></div>
                        <div class="col-md-4"><label class="form-label">Mã Style</label><input type="text" id="style_code" class="form-control" required></div>
                        <div class="col-md-2"><label class="form-label">Size S</label><input type="number" id="qty_s" class="form-control" value="0"></div>
                        <div class="col-md-2"><label class="form-label">Size M</label><input type="number" id="qty_m" class="form-control" value="0"></div>
                        <div class="col-md-2"><label class="form-label">Size L</label><input type="number" id="qty_l" class="form-control" value="0"></div>
                        <div class="col-md-2"><label class="form-label">Size XL</label><input type="number" id="qty_xl" class="form-control" value="0"></div>
                        <div class="col-md-2"><label class="form-label">Size XXL</label><input type="number" id="qty_xxl" class="form-control" value="0"></div>
                        <div class="col-md-2"><label class="form-label">Đơn Giá CM</label><input type="number" id="price_cm" class="form-control" value="0"></div>
                        <div class="col-12 mt-3"><button type="submit" class="btn btn-primary w-100">Lưu & Đồng Bộ Ngay</button></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script>
        const API_URL = 'https://garment-api-xr2e.onrender.com/api/orders';

        function loadOrders() {
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    let rows = '';
                    data.forEach(item => {
                        let totalQty = item.qty_s + item.qty_m + item.qty_l + item.qty_xl + item.qty_xxl;
                        let revenue = totalQty * item.price_cm;
                        rows += `<tr>
                            <td><b>${item.po_code}</b></td>
                            <td>${item.customer}</td>
                            <td>${item.style_code}</td>
                            <td>${item.qty_s}</td>
                            <td>${item.qty_m}</td>
                            <td>${item.qty_l}</td>
                            <td>${item.qty_xl}</td>
                            <td>${item.qty_xxl}</td>
                            <td class="fw-bold text-primary">${totalQty.toLocaleString()}</td>
                            <td>${item.price_cm.toLocaleString()} đ</td>
                            <td class="fw-bold text-success">${revenue.toLocaleString()} đ</td>
                        </tr>`;
                    });
                    if ($.fn.DataTable.isDataTable('#ordersTable')) {
                        $('#ordersTable').DataTable().destroy();
                    }
                    $('#ordersTable tbody').html(rows);
                    $('#ordersTable').DataTable({ language: { search: "🔍 Tìm nhanh:" } });
                });
        }

        $(document).ready(function() {
            loadOrders();

            $('#orderForm').submit(function(e) {
                e.preventDefault();
                const payload = {
                    po_code: $('#po_code').val(),
                    customer: $('#customer').customer ? $('#customer').val() : $('#customer').val(),
                    style_code: $('#style_code').val(),
                    qty_s: parseInt($('#qty_s').val()) || 0,
                    qty_m: parseInt($('#qty_m').val()) || 0,
                    qty_l: parseInt($('#qty_l').val()) || 0,
                    qty_xl: parseInt($('#qty_xl').val()) || 0,
                    qty_xxl: parseInt($('#qty_xxl').val()) || 0,
                    price_cm: parseFloat($('#price_cm').val()) || 0
                };

                fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).then(() => {
                    bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
                    $('#orderForm')[0].reset();
                    loadOrders();
                });
            });
        });
    </script>
</body>
</html>
